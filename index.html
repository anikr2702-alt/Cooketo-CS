<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cooketo — Coming Soon</title>
  <meta name="theme-color" content="#097D4C" />

  <style>
    :root {
      --cream: #FDF7E7;
      --green: #097D4C;
      --orange: #F58A00;
      --dark: #153F2C;
      --checker-size: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: var(--cream);
      color: var(--green);
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Decorative doodles */
    .doodle {
      position: absolute;
      color: var(--green);
      pointer-events: none;
      user-select: none;
      font-weight: 700;
      z-index: 1;
    }

    .d1 { top: 14px; left: 14px; font-size: 27px; transform: rotate(-8deg); }
    .d2 { top: 15px; right: 16px; font-size: 27px; line-height: .75; }
    .d3 { top: 76px; right: 10px; font-size: 21px; transform: rotate(15deg); }
    .d4 { top: 207px; left: 27px; font-size: 27px; transform: rotate(-10deg); }
    .d5 { top: 250px; left: 28px; font-size: 17px; transform: rotate(12deg); }
    .d6 { top: 207px; right: 20px; font-size: 27px; transform: rotate(-10deg); }

    .header {
      width: min(100%, 900px);
      margin: 0 auto;
      padding: clamp(18px, 4vw, 34px) clamp(18px, 5vw, 48px) 0;
      position: relative;
      z-index: 3;
    }

    /*
      Put your transparent logo file in the same folder as this HTML
      and name it "logo.png". The image should contain only the logo
      (not the cream background).
    */
    .logo {
      width: clamp(135px, 24vw, 190px);
      height: auto;
      display: block;
    }

    .title-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: clamp(18px, 4vw, 28px);
      position: relative;
      z-index: 3;
    }

    h1 {
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: clamp(48px, 10vw, 86px);
      line-height: .95;
      font-weight: 900;
      letter-spacing: -0.055em;
      text-transform: uppercase;
      text-align: center;
      color: var(--green);
    }

    .leaf {
      position: absolute;
      width: 18px;
      height: 11px;
      background: var(--green);
      border-radius: 100% 0 100% 0;
    }

    .leaf.left {
      left: clamp(3%, 12vw, 120px);
      bottom: 3px;
      transform: rotate(-35deg);
    }

    .leaf.right {
      right: clamp(3%, 12vw, 120px);
      bottom: -4px;
      transform: rotate(34deg);
    }

    .orange-heart {
      color: var(--orange);
      font-size: 25px;
      display: inline-block;
      margin-top: 4px;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      position: relative;
      padding: 12px clamp(14px, 4vw, 38px) 0;
      z-index: 2;
    }

    /*
      Put your transparent characters image in the same folder as this HTML
      and name it "characters.png".
    */
    .characters {
      width: min(88vw, 610px);
      max-height: min(47vh, 250px);
      object-fit: contain;
      object-position: bottom center;
      display: block;
      margin: 0 auto;
    }

    .checker {
      width: 100%;
      height: clamp(14px, 2.2vw, 18px);
      margin-top: clamp(5px, 1.2vw, 10px);
      position: relative;
      z-index: 4;

      background:
        conic-gradient(from 90deg at 50% 50%,
          var(--green) 0 25%,
          var(--cream) 0 50%,
          var(--green) 0 75%,
          var(--cream) 0) 0 0 /
        calc(var(--checker-size) * 2) var(--checker-size);
    }

    .bottom {
      height: clamp(40px, 9vh, 64px);
      background: var(--green);
      flex-shrink: 0;
    }

    @media (max-width: 600px) {
      .header {
        padding-top: 16px;
      }

      .logo {
        width: 145px;
      }

      .title-wrap {
        margin-top: 22px;
      }

      h1 {
        font-size: clamp(43px, 14vw, 62px);
      }

      .characters {
        width: min(94vw, 530px);
        max-height: 38vh;
      }

      .d1, .d2, .d3, .d4, .d5, .d6 {
        transform: scale(.78);
      }
    }

    @media (max-width: 390px) {
      h1 {
        font-size: 41px;
      }

      .characters {
        width: 98vw;
        max-height: 34vh;
      }

      .bottom {
        height: 38px;
      }
    }

    @media (min-width: 1000px) {
      .page {
        max-width: 1200px;
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <!-- Small decorative doodles -->
    <span class="doodle d1">〰</span>
    <span class="doodle d2">✣</span>
    <span class="doodle d3">◆</span>
    <span class="doodle d4">✳</span>
    <span class="doodle d5">✳</span>
    <span class="doodle d6">〰</span>

    <header class="header">
      <img class="logo" src="logo.png" alt="Cooketo logo" />

      <div class="title-wrap">
        <span class="leaf left" aria-hidden="true"></span>

        <div>
          <h1>Coming Soon</h1>
          <div style="text-align:center;">
            <span class="orange-heart">♥</span>
          </div>
        </div>

        <span class="leaf right" aria-hidden="true"></span>
      </div>
    </header>

    <section class="content">
      <img
        class="characters"
        src="characters.png"
        alt="Cooketo characters"
      />
    </section>

    <div class="checker" aria-hidden="true"></div>
    <footer class="bottom"></footer>

  </main>
</body>
</html>
