<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Coming Soon</title>
<style>
  :root{
    --cream:#FDF7E7;
    --green:#097D4C;
    --orange:#F58A00;
    --ink:#0B2A1D;
    --muted:#4B6B5C;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    overflow-x:hidden;
  }
  /* ambient animated field */
  .field{position:fixed;inset:0;overflow:hidden;z-index:0}
  .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.16;will-change:transform}
  .b1{width:46vw;height:46vw;left:-10vw;top:-12vw;background:var(--green);animation:drift1 22s ease-in-out infinite}
  .b2{width:38vw;height:38vw;right:-8vw;top:8vh;background:var(--orange);animation:drift2 26s ease-in-out infinite}
  .b3{width:42vw;height:42vw;left:22vw;bottom:-20vw;background:#0BA163;opacity:.12;animation:drift3 30s ease-in-out infinite}
  @keyframes drift1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(6vw,5vh,0) scale(1.12)}}
  @keyframes drift2{0%,100%{transform:translate3d(0,0,0) scale(1.05)}50%{transform:translate3d(-7vw,7vh,0) scale(.92)}}
  @keyframes drift3{0%,100%{transform:translate3d(0,0,0) scale(.95)}50%{transform:translate3d(5vw,-6vh,0) scale(1.1)}}

  .grid{position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(rgba(9,125,76,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(9,125,76,.07) 1px,transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(circle at 50% 40%,#000 20%,transparent 78%);
    -webkit-mask-image:radial-gradient(circle at 50% 40%,#000 20%,transparent 78%);
  }
  .spot{position:fixed;width:520px;height:520px;border-radius:50%;z-index:0;pointer-events:none;
    background:radial-gradient(circle,rgba(245,138,0,.16),transparent 62%);
    transform:translate(-50%,-50%);transition:transform .35s cubic-bezier(.2,.7,.3,1)}

  .wrap{position:relative;z-index:2;min-height:100%;display:flex;flex-direction:column;
    max-width:1080px;margin:0 auto;padding:32px 32px 40px}

  header{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .logo{display:flex;align-items:center;gap:12px;font-weight:650;letter-spacing:-.01em}
  .logo img{height:88px;width:auto;max-width:300px;object-fit:contain;display:block}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
    border:1px solid rgba(9,125,76,.25);background:rgba(255,255,255,.55);backdrop-filter:blur(8px);
    font-size:14px;color:var(--green);font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--orange);animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.45}}

  main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:44px 0 8px}
  h1{margin:0;font-size:clamp(46px,8.6vw,104px);line-height:.96;letter-spacing:-.035em;font-weight:700}
  h1 .line{display:block;overflow:hidden;padding-bottom:.06em}
  h1 .line span{display:block;transform:translateY(110%);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
  h1 .line:nth-child(2) span{animation-delay:.12s}
  .accent{color:var(--green)}
  .accent em{font-style:normal;color:var(--orange)}
  @keyframes rise{to{transform:translateY(0)}}

  .sub{margin:24px 0 0;max-width:560px;font-size:18px;line-height:1.6;color:var(--muted);
    opacity:0;animation:fade .8s ease .5s forwards}
  @keyframes fade{to{opacity:1}}

  .count{display:flex;gap:12px;margin:40px 0 0;flex-wrap:wrap;opacity:0;animation:fade .8s ease .68s forwards}
  .unit{min-width:104px;flex:0 0 auto;padding:16px 18px;border-radius:12px;
    background:rgba(255,255,255,.78);border:1px solid rgba(9,125,76,.20);backdrop-filter:blur(10px);box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .unit b{display:block;font-size:36px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--green)}
  .unit small{display:block;margin-top:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

  footer{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
    padding-top:24px;margin-top:32px;border-top:1px solid rgba(9,125,76,.16);
    font-size:14px;color:var(--muted);opacity:0;animation:fade .8s ease 1s forwards}
  footer a{color:var(--green);text-decoration:none;font-weight:600}
  footer a:hover{color:var(--orange)}

  @media (max-width:600px){
    .wrap{padding:24px 20px 32px}
    .unit{min-width:calc(50% - 6px);flex:1 1 calc(50% - 6px)}
    .spot{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    h1 .line span{transform:none}
    .sub,.count,footer{opacity:1}
  }
</style>
</head>
<body>
  <div class="field" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  </div>
  <div class="grid" aria-hidden="true"></div>
  <div class="spot" id="spot" aria-hidden="true"></div>

  <div class="wrap">
    <header>
      <div class="logo"><img src="logo.png" alt="Logo" /></div>
      <span class="pill"><span class="dot" aria-hidden="true"></span>Launching soon</span>
    </header>

    <main>
      <h1>
        <span class="line"><span>Something good</span></span>
        <span class="line"><span class="accent">is <em>brewing</em>.</span></span>
      </h1>
      <p class="sub">We're putting the final touches on something new. Follow along on Instagram — that's where the reveal happens first.</p>

      <div class="count" id="count" role="timer" aria-live="off">
        <div class="unit"><b id="d">00</b><small>Days</small></div>
        <div class="unit"><b id="h">00</b><small>Hours</small></div>
        <div class="unit"><b id="m">00</b><small>Minutes</small></div>
        <div class="unit"><b id="s">00</b><small>Seconds</small></div>
      </div>

    </main>

    <footer>
      <span>© <span id="yr">2026</span> All rights reserved</span>
      <span><a href="https://www.instagram.com/c00keto.in/" target="_blank" rel="noopener">Instagram</a></span>
    </footer>
  </div>

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();

  // countdown: 30 days out
  var target = new Date(Date.now() + (28*24*60*60 + 16*60*60 + 33*60 + 42)*1000);
  var pad = function(n){ return String(n).padStart(2,'0'); };
  function tick(){
    var t = Math.max(0, target - new Date());
    var s = Math.floor(t/1000);
    document.getElementById('d').textContent = pad(Math.floor(s/86400));
    document.getElementById('h').textContent = pad(Math.floor(s%86400/3600));
    document.getElementById('m').textContent = pad(Math.floor(s%3600/60));
    document.getElementById('s').textContent = pad(s%60);
  }
  tick(); setInterval(tick, 1000);

  // cursor spotlight
  var spot = document.getElementById('spot');
  spot.style.left = '50%'; spot.style.top = '45%';
  window.addEventListener('pointermove', function(e){
    spot.style.left = e.clientX + 'px';
    spot.style.top = e.clientY + 'px';
  });

</script>
</body>
</html>
